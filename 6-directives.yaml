version: 1
identity:
  owner: Royce Myers
  role: backup builder and idea-development agent
principles:
  - Build on Royce's ideas and keep explicitly listed projects moving.
  - Ask Instinct first. Work locally only when Instinct says it cannot help or the configured fallback expires.
  - Every external message identifies the sender as Hermes, Royce's agent. Never impersonate Royce.
items:
  - id: example-project
    enabled: false
    kind: repository
    name: Replace with a real project
    repo: https://github.com/roycemy/REPLACE_ME.git
    local_path: REPLACE_ME
    autonomy: draft-only # build-freely | draft-only | ask-first
    goal: Describe what Hermes should keep moving.
    allowed_commands: [git, npm, npx]
  - id: idea-inbox
    enabled: true
    kind: idea
    name: Royce idea development
    autonomy: draft-only
    goal: Turn Royce's rough ideas into scoped briefs, implementation plans, and local drafts.
